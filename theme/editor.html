<!doctype html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&display=swap">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZhiThemes Editor</title>
<style>
  :root {
    --bg: #0a0d14; --bg2: #0f131c; --panel: #141925; --panel2: #1a2030; --line: #242c3d; --line2: #303a50;
    --text: #e8ebf2; --muted: #8b94aa; --dim: #5d667c; --accent: #2fd0e6; --accent2: #5b7cff;
    --accent-ink: #04222a; --ok: #4ade80; --err: #f87171; --warn: #fbbf24;
    --r: 10px; --head: 72px; --tabs: 0px; --side: 244px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; color: var(--text); font: 13.5px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: radial-gradient(1200px 500px at 85% -10%, rgba(47, 208, 230, .08), transparent 60%),
                     radial-gradient(900px 400px at -10% 110%, rgba(91, 124, 255, .07), transparent 60%), var(--bg);
         background-attachment: fixed; min-height: 100vh; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 10px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }
  /* ---- header + tabs ---- */
  .top { position: sticky; top: 0; z-index: 20; background: rgba(10, 13, 20, .86); backdrop-filter: blur(12px);
         border-bottom: 1px solid var(--line); }
  header { display: flex; gap: 8px; align-items: center; height: var(--head); padding: 0 16px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
  .logo { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center;
          background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-weight: 800; font-size: 15px;
          box-shadow: 0 4px 16px rgba(47, 208, 230, .25); }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .2px; white-space: nowrap; }
  .brand h1 span { color: var(--muted); font-weight: 500; }
  #status { font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 20px; background: var(--panel);
            border: 1px solid var(--line); white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
  #status::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px;
                    background: var(--dim); vertical-align: 1px; }
  #status.ok { color: var(--ok); } #status.ok::before { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  #status.err { color: var(--err); } #status.err::before { background: var(--err); }
  /* progress: a bar under the status pill (uploads to the PS5) and .zt-prog boxes (downloads, video) */
  #status { position: relative; }
  #stBar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent); display: none;
           transition: width .2s; border-radius: 2px; }
  #status.prog #stBar { display: block; }
  #status.prog.wait #stBar { width: 30% !important; animation: ztWait 1.1s ease-in-out infinite alternate; }
  .zt-prog { position: relative; margin: 6px 0; padding: 7px 10px 10px; border-radius: 8px; background: var(--panel);
             border: 1px solid var(--line); font-size: 12px; color: var(--muted); overflow: hidden; }
  .zt-prog b { font-weight: normal; position: relative; }
  .zt-prog i { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2));
               transition: width .2s; }
  .zt-prog.wait i { width: 30% !important; animation: ztWait 1.1s ease-in-out infinite alternate; }
  .ct-pic .zt-thumb { position: absolute; left: 6px; right: 6px; top: 6px; height: 3px; border-radius: 2px; background: #0006; overflow: hidden; }
  .ct-pic .zt-thumb i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .ct-pic .zt-thumb.wait i { width: 30%; animation: ztWait 1.1s ease-in-out infinite alternate; }
  @keyframes ztWait { from { margin-left: 0; } to { margin-left: 70%; } }
  .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
  /* the theme's name in the middle of the top bar (click to change) */
  header .brand { margin-right: 0; flex: 1 1 0; }
  #themeTitleBox { flex: 0 1 auto; min-width: 0; display: flex; justify-content: center; }
  #themeTitleBox + .grow { flex: 1 1 0; }
  #themeTitle { max-width: 100%; box-sizing: border-box;
                font: 700 26px/1 'Orbitron', 'Segoe UI', system-ui, sans-serif; letter-spacing: 2px; text-transform: uppercase;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 6px 14px; border-radius: 10px;
                background: linear-gradient(90deg, #fff 0%, var(--accent) 55%, var(--accent2) 100%);
                -webkit-background-clip: text; background-clip: text; color: transparent; cursor: pointer; }
  #themeTitle small { display: block; font: 500 10px/1 system-ui, sans-serif; letter-spacing: 3px; color: var(--muted); margin-top: 4px; }
  @media (max-width: 1500px) { #themeTitle { font-size: 20px; letter-spacing: 1px; } header .brand h1 span { display: none; } }
  header .brand h1 { overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 1100px) { #themeTitleBox { display: none; } header .brand { flex: 0 1 auto; margin-right: auto; } }
  /* themes on the PS5 (Themes/<Name>.ztheme) */
  #themesWrap { position: relative; }
  #btnThemes { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  #btnThemes b { color: var(--accent); font-weight: 650; }
  #themesPanel { position: absolute; right: 0; top: calc(100% + 6px); width: 540px; max-width: calc(100vw - 32px); max-height: 70vh; overflow: auto; z-index: 40;
                 background: var(--panel); border: 1px solid var(--line2); border-radius: var(--r); padding: 10px;
                 box-shadow: 0 12px 40px rgba(0, 0, 0, .5); display: none; }
  #themesPanel.open { display: block; }
  #themesPanel .th-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; }
  #themesPanel .th-row:hover { background: var(--panel2); }
  #themesPanel .th-row.on { box-shadow: inset 2px 0 0 var(--accent); background: var(--bg2); }
  #themesPanel .th-name { flex: 1 0 auto; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  #themesPanel .th-size { color: var(--dim); font-size: 11.5px; white-space: nowrap; }
  #themesPanel .th-row button { padding: 3px 8px; font-size: 12px; }
  #themesPanel .th-new { display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  #themesPanel .th-new button { flex: 1; }
  #themesPanel .th-tip { color: var(--muted); font-size: 12px; margin: 6px 4px 2px; }
  button, label.btn, select.btn, a.btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; line-height: 1.3;
    transition: border-color .12s, background .12s, color .12s;
  }
  button:hover, label.btn:hover, select.btn:hover, a.btn:hover { border-color: var(--line2); background: var(--panel2); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: linear-gradient(135deg, var(--accent), #3fb6ff); border-color: transparent; color: var(--accent-ink);
                   font-weight: 650; padding: 6px 16px; box-shadow: 0 4px 14px rgba(47, 208, 230, .25); }
  button.primary:hover { filter: brightness(1.08); background: linear-gradient(135deg, var(--accent), #3fb6ff); }
  /* tabs in a side bar on the left */
  body { padding-left: var(--side); }
  .top { margin-left: calc(-1 * var(--side)); }
  nav#tabs { position: fixed; left: 0; top: var(--head); bottom: 0; width: var(--side); z-index: 15; display: flex; flex-direction: column;
             gap: 3px; padding: 10px 8px 16px; overflow-y: auto; overflow-x: hidden; border-right: 1px solid var(--line);
             background: rgba(10, 13, 20, .72); backdrop-filter: blur(10px); scrollbar-width: thin; }
  nav#tabs .side-top { display: flex; flex-direction: column; gap: 6px; padding: 0 2px 10px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
  nav#tabs .side-top .advsw { justify-content: center; }
  nav#tabs button.tab { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none;
                        color: var(--muted); padding: 7px 8px; border-radius: 10px; font-weight: 500; }
  nav#tabs button.tab:hover { color: var(--text); background: var(--panel); }
  nav#tabs button.tab.on { color: var(--text); background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
  nav#tabs .ti { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 9px; background: var(--panel);
                 border: 1px solid var(--line); }
  nav#tabs .ti svg { width: 20px; height: 20px; }
  nav#tabs button.tab.on .ti { color: var(--accent); border-color: rgba(47, 208, 230, .45); background: rgba(47, 208, 230, .08); }
  nav#tabs .tt { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.25; }
  nav#tabs .tt b { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav#tabs .tt small { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav#tabs .count { flex: none; font-size: 10.5px; font-weight: 650; color: var(--accent-ink); background: var(--accent); border-radius: 10px;
                    padding: 0 6px; min-width: 18px; text-align: center; }
  #search { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
            padding: 6px 10px; font: inherit; font-size: 13px; }
  #tabhead { display: flex; gap: 18px; align-items: center; max-width: 1280px; margin: 0 auto; padding: 18px 20px 0; }
  #tabhead .tabpic { width: 192px; height: 108px; flex: none; }
  #tabhead h2 { margin: 0; font-size: 20px; font-weight: 650; }
  #tabhead .th-desc { margin: 2px 0 0; color: var(--muted); }
  #tabhead .th-n { margin: 6px 0 0; font-size: 12px; color: var(--dim); } #tabhead .th-n b { color: var(--accent); font-weight: 600; }
  #tabhead .th-sub { display: flex; gap: 6px; margin-top: 10px; }
  #tabhead .th-sub button.on { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 900px) {
    :root { --side: 62px; }
    nav#tabs .tt, nav#tabs #search { display: none; }
    nav#tabs button.tab { justify-content: center; padding: 6px 4px; position: relative; }
    nav#tabs .count { position: absolute; top: 2px; right: 2px; }
    nav#tabs .side-top .advsw { padding: 4px 2px; font-size: 10px; gap: 3px; }
    nav#tabs .advsw .advtxt { display: none; } nav#tabs .advsw::after { content: "Adv"; }
    .brand h1 span, #fwinfo { display: none; }
    #tabhead .tabpic { width: 128px; height: 72px; }
  }
  main { padding: 18px 20px 40px; max-width: 1280px; margin: 0 auto; }
  main.wide { max-width: none; padding: 12px 16px 16px; }
  /* ---- field cards ---- */
  .section { margin-bottom: 22px; }
  .iconstrip { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .iconbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 104px; padding: 12px 6px 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); color: var(--text); cursor: pointer; font: inherit; }
  .iconbtn:hover, .iconbtn:focus-visible { border-color: var(--accent); outline: none; }
  .iconbtn.off .ib-pic { opacity: .35; }
  .ib-pic { display: grid; place-items: center; width: 40px; height: 40px; }
  .ib-pic svg, .ib-pic img { width: 34px; height: 34px; object-fit: contain; }
  .ib-name { font-size: 13px; font-weight: 600; }
  .ib-state { font-size: 11px; color: var(--muted); }
  .iconbtn:not(.off) .ib-state { color: var(--accent); }
  .subhead { font-size: 12px; color: var(--muted); font-weight: 600; margin: 4px 0 10px; }
  .iw-back { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; }
  .iw { width: min(920px, 100%); max-height: 86vh; overflow: auto; background: var(--bg2); border: 1px solid var(--line2);
    border-radius: 14px; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .iw-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .iw-head h3 { margin: 0; font-size: 18px; flex: 1; }
  .iw-close { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; }
  .section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 650;
                margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
  .section h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
  .card { background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--line); border-radius: var(--r);
          padding: 10px 12px 11px; transition: border-color .12s; min-width: 0; }
  .card:hover { border-color: var(--line2); }
  .card.changed { border-color: rgba(47, 208, 230, .35); }
  .card .head { display: flex; gap: 8px; align-items: center; min-height: 22px; }
  .card .key { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .id { font: 11px ui-monospace, Consolas, monospace; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .reset { padding: 0 6px; font-size: 12px; border-radius: 6px; color: var(--accent); background: none;
                 border-color: transparent; visibility: hidden; }
  .card.changed .reset { visibility: visible; }
  .card .reset:hover { border-color: var(--accent); background: none; }
  .card .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .card .fab { color: var(--dim); white-space: nowrap; }
  /* one colour control for every colour field */
  .colour { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; }
  .colour .swatch { position: relative; width: 44px; height: 28px; border-radius: 8px; border: 1px solid var(--line2); cursor: pointer; overflow: hidden;
    background: repeating-conic-gradient(#888 0 25%, #ccc 0 50%) 0 0 / 10px 10px; flex: none; }
  .colour .swatch span { position: absolute; inset: 0; }
  .colour .swatch.stock { background: var(--bg2); }
  .colour .swatch.stock span { background: linear-gradient(135deg, transparent 46%, var(--dim) 47% 53%, transparent 54%) !important; opacity: 1 !important; }
  .colour .swatch input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
  .colour .cval { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); min-width: 64px; }
  .colour .calpha { flex: 1; min-width: 80px; }
  .colour .cstock { padding: 2px 10px; font-size: 12px; }
  .colour .cstock.on { border-color: var(--accent); color: var(--accent); }
  .colour .chips { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; }
  .colour .chips button { width: 18px; height: 18px; min-width: 0; padding: 0; border-radius: 5px; border: 1px solid var(--line2); cursor: pointer; }
  .colour .chips button.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card.adv { border-left: 3px solid rgba(251, 191, 36, .55); }
  .card .advtag { font-size: 10px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; padding: 1px 6px; border-radius: 6px;
    color: var(--warn); background: rgba(251, 191, 36, .14); white-space: nowrap; }
  .advsw { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .advsw input { accent-color: var(--accent); margin: 0; }
  .vpanel .morebtn { width: 100%; margin: 6px 0; font-size: 12.5px; }
  .vpanel .more { border-left: 2px solid var(--line2); padding-left: 8px; margin-left: 2px; }
  .vpanel h4.sub { margin: 10px 0 5px; color: var(--accent); opacity: .8; }
  .ctl { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .ctl select.btn { flex: 1; min-width: 0; }
  .avatar-maker { position: fixed; inset: 0; z-index: 1000; background: #000a; display: flex; align-items: center; justify-content: center; }
  .avatar-maker .am-box { background: #101826; border: 1px solid #2a3a50; border-radius: 14px; padding: 16px 20px; max-width: 760px; }
  .avatar-maker h3 { margin: 0 0 12px; }
  .avatar-maker .am-main { display: flex; gap: 18px; flex-wrap: wrap; }
  .avatar-maker canvas { width: 360px; height: 360px; cursor: grab; touch-action: none; border-radius: 8px; }
  .avatar-maker .am-left { display: flex; flex-direction: column; gap: 8px; width: 360px; }
  .avatar-maker canvas.am-time { width: 360px; height: 34px; cursor: pointer; border-radius: 6px; }
  .avatar-maker .am-play { display: flex; gap: 8px; align-items: center; font-size: 12px; opacity: .85; }
  .avatar-maker .am-play .btn { padding: 2px 10px; }
  .avatar-maker .am-ctl { display: flex; flex-direction: column; gap: 10px; width: 300px; }
  .avatar-maker label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .avatar-maker .am-info { margin: 0; font-size: 13px; opacity: .8; }
  .avatar-maker .am-btns { display: flex; gap: 8px; margin-top: auto; }
  .ctl img.avatar-prev { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; background: #0003; }
  input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  input[type=number], input[type=text] {
    background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; font: inherit; font-size: 13px;
  }
  input[type=number] { width: 72px; text-align: right; }
  input[type=text] { flex: 1; min-width: 0; }
  input[type=color] { width: 34px; height: 30px; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); flex: none; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--line2); border-radius: 12px; transition: .15s; }
  .switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
                        background: var(--text); border-radius: 50%; transition: .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); background: var(--accent-ink); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  textarea {
    width: 100%; height: calc(100vh - var(--head) - var(--tabs) - 110px); min-height: 300px; resize: vertical;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: var(--r); padding: 12px;
    font: 12.5px/1.5 ui-monospace, Consolas, monospace; tab-size: 2;
  }
  pre#log { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
            padding: 12px; height: calc(100vh - var(--head) - var(--tabs) - 120px); min-height: 260px; overflow: auto;
            white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); }
  pre#log .theme { color: var(--text); } pre#log .bad { color: var(--err); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .tip { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  #fwinfo { font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 20px; background: var(--panel);
             border: 1px solid var(--line); white-space: nowrap; }
  #fwinfo:empty { display: none; } #fwinfo.debug { color: var(--warn); border-color: rgba(251, 191, 36, .4); }
  .sysgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .sysgrid .key { font-size: 15px; margin-top: 2px; white-space: normal; word-break: break-word; }
  .qrbox { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
  .sysgrid .link { overflow-wrap: anywhere; }
  .qrbox .qr { width: 112px; height: 112px; border-radius: 6px; flex: none; display: block; }
  .qrbox a.btn { display: inline-block; text-decoration: none; }
  .logfile { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid var(--line);
             border-radius: var(--r); background: var(--panel); margin-bottom: 6px; }
  .logfile .grow { flex: 1; min-width: 0; } .logfile b { font-weight: 600; word-break: break-all; }
  .logfile .hint { color: var(--muted); font-size: 12px; }
  pre#log.short { height: 420px; }
  .about p { margin: 8px 0 0; color: var(--text); } .about .ver { color: var(--muted); font-weight: 500; font-size: 13px; }
  .card .link { margin-top: 6px; font-size: 13px; color: var(--muted); } .card .link a { color: var(--accent); }
  #file, #bgfile, #fontfile, #ps5bgfile { display: none; }
  /* ---- folders tab ---- */
  .fold-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 900px) { .fold-wrap { grid-template-columns: minmax(0, 1fr); } }
  .fold-box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-height: 120px; }
  .fold-box h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .fold-games { display: flex; flex-wrap: wrap; gap: 8px; min-height: 84px; border-radius: 8px; padding: 4px; }
  .fold-games.over { outline: 2px dashed var(--accent); outline-offset: 2px; }

<div class="top">
<header>
  <div class="brand"><div class="logo">Z</div><h1>ZhiThemes <span>· PS5 theme editor · by Zhi</span></h1></div>
  <div id="themeTitleBox"><div id="themeTitle" title="The theme in use. To change its name: Theme ▾ → Rename">…</div></div><span class="grow"></span>

  <div id="themesWrap">

    <div id="themesPanel"></div>

  <input type="file" id="file" accept=".ztheme,.zip,.js,text/javascript,text/plain">
  <!-- "Letra…" cancelado (ZhiThemes 11) -->

  <input type="file" id="ps5bgfile" accept=".png,.jpg,.jpeg,.mp4">

  <button id="btnFactory" title="Put every field back to the PS5 stock value and apply">Reset all</button>
  <button id="btnApply" class="primary" title="Save on the console and reload the Home (Ctrl+S)">Apply</button>
</header>
</div>
<nav id="tabs"></nav>

  function tabGroups() {

  var loaded = '';

      var was = valuesOf(loaded), now = valuesOf(t), mine = valuesOf(source), took = [];
      for (var k in now) {
        if (now[k] === was[k] || !(k in mine)) continue;
        if (mine[k] === was[k]) { setField(k, now[k]); took.push(k); }
        else if (k === 'folders' && mine[k] !== now[k]) {

             colour was lost): the page's changes go onto the PS5's folders */
          var un = function (v) { return String(v).replace(/^'|'$/g, ''); };
          setField('folders', jsString(foldMerge(un(was[k]), un(now[k]), un(mine[k]))));

      setField('fakeTitleY', String(Math.round(b[1])));
    } else if (c.homeTitle) {
      setField('fakeTitleX', String(num(c.homeTitleX)));
      setField('fakeTitleY', String(num(c.homeTitleY)));
    }
    /* the folder name was drawn at the old Home title's place */
    setField('folderTitleX', String(num(c.homeTitleX)));
    setField('folderTitleY', String(num(c.homeTitleY)));
    setField('folderTitleSize', String(num(c.homeTitleFontSize) || 72));
    setField('folderTitleColor', jsString(c.homeTitleColor || ''));

    /* the old hideTileName took the PS5 symbol too */

    var kind = /Icon$|^tabsGroup(Left|Right)$|^particlesImage$/.test(bgUploadKey) ? 'icons' : 'wallpapers';
