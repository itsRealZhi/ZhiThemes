name: Firmware report
description: ZhiThemes on a firmware other than 9.60 (works or not, both help)
title: "[FW] "
labels: ["firmware"]
body:
  - type: markdown
    attributes:
      value: |
        ZhiThemes is only tested on firmware 9.60. A report from another firmware, even "everything works", helps a lot.
        Please turn on **Debug mode** in the Logs tab first and attach the log.

  - type: input
    id: firmware
    attributes:
      label: PS5 firmware
      placeholder: "10.01"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ZhiThemes version
      placeholder: "0.1.0-alpha"
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Everything I tried works
        - Works, but some options do nothing or look wrong
        - The theme does not load / the Home crashes
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: What works and what does not

  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach the log file (drag it here), or paste it.
      render: text
    validations:
      required: true
