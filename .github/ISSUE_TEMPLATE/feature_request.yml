name: Idea / feature request
description: Something you would like a theme to be able to change
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to change?
      description: Which part of the PS5 screen, and how it should look or behave.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: A screenshot, a mock-up, or another console / launcher that does it.
